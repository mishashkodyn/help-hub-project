<div class="camera-wall">
  @for (cam of cameras; track cam.cameraId) {
    <div class="camera-cell">
      @if (cam.displayedSrc) {
        <img [src]="cam.displayedSrc" [alt]="cam.cameraId" />
      } @else {
        <div class="no-signal">
          <mat-icon>videocam_off</mat-icon>
        </div>
      }
      <div class="cam-label">
        <span>{{ cam.cameraId }}</span>
        @if (isLive(cam)) {
          <span class="live-dot"></span>
        }
      </div>
    </div>
  }
</div>
