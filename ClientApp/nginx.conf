server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Translations are fetched at runtime and are NOT hash-versioned, so they must
    # always be revalidated. Otherwise a copy cached by the browser keeps being
    # served after a deploy that added new keys, and the UI shows raw i18n keys.
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
    }

    # The SPA shell points at hash-named bundles; if it is cached the browser keeps
    # loading an old build (and its old translations). Always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
